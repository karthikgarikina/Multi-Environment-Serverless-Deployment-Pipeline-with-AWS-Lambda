name: Serverless Deployment Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'

jobs:
  test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies and run pytest
        run: |
          pip install -r requirements-dev.txt
          pytest -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate Terraform configurations
        run: |
          for env in dev staging prod; do
            echo "Validating $env environment..."
            terraform -chdir="terraform/environments/$env" init -backend=false -input=false
            terraform -chdir="terraform/environments/$env" validate
          done

  deploy-dev:
    name: Deploy Dev
    if: startsWith(github.ref, 'refs/heads/feature/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Plan and Apply Dev Environment
        env:
          TF_VAR_api_key_value: ${{ secrets.API_KEY_VALUE }}
          TF_VAR_owner: ${{ vars.PROJECT_OWNER }}
        run: |
          terraform -chdir=terraform/environments/dev init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
          terraform -chdir=terraform/environments/dev plan -out=tfplan
          terraform -chdir=terraform/environments/dev apply -auto-approve tfplan

  deploy-staging:
    name: Deploy Staging (Manual Gate)
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # Configure required reviewers for the 'staging' GitHub Environment to enforce manual approval
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Plan and Apply Staging Environment
        env:
          TF_VAR_api_key_value: ${{ secrets.API_KEY_VALUE }}
          TF_VAR_owner: ${{ vars.PROJECT_OWNER }}
        run: |
          terraform -chdir=terraform/environments/staging init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=staging.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
          terraform -chdir=terraform/environments/staging plan -out=tfplan
          terraform -chdir=terraform/environments/staging apply -auto-approve tfplan

  deploy-prod-green:
    name: Deploy Prod (Blue/Green)
    if: github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Step 1 - Publish Green Candidate (Traffic Stays on Blue)
        env:
          TF_VAR_api_key_value: ${{ secrets.API_KEY_VALUE }}
          TF_VAR_owner: ${{ vars.PROJECT_OWNER }}
        run: |
          terraform -chdir=terraform/environments/prod init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=prod.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
          terraform -chdir=terraform/environments/prod apply -auto-approve \
            -var='deployment_color=Green' \
            -var='active_color=blue'
          VERSION=$(terraform -chdir=terraform/environments/prod output -raw published_version)
          aws lambda update-alias --function-name serverless-hello-prod-hello --name green --function-version "$VERSION"

      - name: Step 2 - Validate Isolated Green Alias
        run: |
          aws lambda invoke --function-name serverless-hello-prod-hello --qualifier green --cli-binary-format raw-in-base64-out --payload '{}' response.json
          cat response.json
          grep -q 'Hello from Prod (Green)!' response.json

      - name: Step 3 - Shift API Gateway Traffic from Blue to Green
        env:
          TF_VAR_api_key_value: ${{ secrets.API_KEY_VALUE }}
          TF_VAR_owner: ${{ vars.PROJECT_OWNER }}
        run: |
          terraform -chdir=terraform/environments/prod apply -auto-approve \
            -var='deployment_color=Green' \
            -var='active_color=green'

      - name: Rollback Advisory
        if: failure()
        run: |
          echo "Traffic remains on Blue until the final apply. If switching failed, rerun Terraform with -var='active_color=blue'."
